<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="Swift and Kotlin clients over a shared React Native and Flutter core, backed by a Node.js API and Postgres">
  <style>
    .label { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 14px; fill: #1f2328; }
    .caption { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #59636e; letter-spacing: 0.1em; }
    .node { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
    .wire { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 5 9; animation: flow 1.8s linear infinite; }
    .w1 { stroke: #F05138; }
    .w2 { stroke: #7F52FF; }
    .w3 { stroke: #5FA04E; animation-delay: 0.45s; }
    .w4 { stroke: #4169E1; animation-delay: 0.9s; }
    .core { fill: #f6f8fa; stroke: #0175C2; stroke-width: 1.5; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    .pulse2 { animation: pulse 3s ease-in-out infinite; animation-delay: 1.5s; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  </style>

  <rect x="60" y="20" width="150" height="44" rx="8" class="node" />
  <text x="135" y="47" class="label" text-anchor="middle">Swift · iOS</text>

  <rect x="670" y="20" width="150" height="44" rx="8" class="node" />
  <text x="745" y="47" class="label" text-anchor="middle">Kotlin · Android</text>

  <path d="M135 64 C135 108, 250 129, 330 129" class="wire w1" />
  <path d="M745 64 C745 108, 630 129, 550 129" class="wire w2" />

  <rect x="330" y="104" width="220" height="50" rx="10" class="core" />
  <text x="440" y="134" class="label" text-anchor="middle">React Native · Flutter</text>
  <text x="440" y="180" class="caption" text-anchor="middle">ONE CODEBASE, TWO STORES</text>

  <path d="M375 154 C330 182, 230 196, 135 196" class="wire w3" />
  <path d="M505 154 C550 182, 650 196, 745 196" class="wire w4" />

  <rect x="60" y="196" width="150" height="44" rx="8" class="node pulse" />
  <text x="135" y="223" class="label" text-anchor="middle">Node.js API</text>

  <rect x="670" y="196" width="150" height="44" rx="8" class="node pulse2" />
  <text x="745" y="223" class="label" text-anchor="middle">Postgres</text>
</svg>
