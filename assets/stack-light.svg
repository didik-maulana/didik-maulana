<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Swift and Kotlin clients over a shared React Native and Flutter core, a Node.js API, Postgres, Supabase and Firebase, released through Fastlane and GitLab CI and watched with Sentry and Datadog">
  <style>
    .label { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #1f2328; }
    .lane { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #59636e; letter-spacing: 0.14em; }
    .node { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
    .core { fill: #f6f8fa; stroke: #0175C2; stroke-width: 1.5; }
    .wire { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 5 9; animation: flow 1.8s linear infinite; }
    .swift { stroke: #F05138; }
    .kotlin { stroke: #7F52FF; animation-delay: 0.3s; }
    .core-wire { stroke: #0175C2; animation-delay: 0.6s; }
    .data { stroke: #4169E1; animation-delay: 0.9s; }
    .ship { stroke: #5FA04E; animation-delay: 0.45s; }
    .watch { stroke: #59636e; animation-delay: 1.2s; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
  </style>

  <text x="24" y="66" class="lane">NATIVE PLATFORM</text>
  <text x="24" y="166" class="lane">CROSS PLATFORM</text>
  <text x="24" y="266" class="lane">SERVICES</text>
  <text x="24" y="366" class="lane">DATA</text>

  <rect x="150" y="40" width="180" height="44" rx="8" class="node" />
  <text x="240" y="67" class="label" text-anchor="middle">Swift · iOS</text>

  <rect x="350" y="40" width="180" height="44" rx="8" class="node" />
  <text x="440" y="67" class="label" text-anchor="middle">Kotlin · Android</text>

  <path d="M240 84 C240 112, 280 140, 300 140" class="wire swift" />
  <path d="M440 84 C440 112, 400 140, 380 140" class="wire kotlin" />

  <rect x="150" y="140" width="380" height="48" rx="10" class="core" />
  <text x="340" y="169" class="label" text-anchor="middle">React Native · Flutter · shared packages</text>

  <path d="M340 188 L340 240" class="wire core-wire" />

  <rect x="210" y="240" width="260" height="44" rx="8" class="node" />
  <text x="340" y="267" class="label" text-anchor="middle">Node.js · Express API</text>

  <path d="M340 284 C340 312, 210 312, 210 340" class="wire data" />
  <path d="M340 284 L340 340" class="wire data" />
  <path d="M340 284 C340 312, 470 312, 470 340" class="wire data" />

  <rect x="150" y="340" width="120" height="44" rx="8" class="node" />
  <text x="210" y="367" class="label" text-anchor="middle">Postgres</text>

  <rect x="280" y="340" width="120" height="44" rx="8" class="node" />
  <text x="340" y="367" class="label" text-anchor="middle">Supabase</text>

  <rect x="410" y="340" width="120" height="44" rx="8" class="node" />
  <text x="470" y="367" class="label" text-anchor="middle">Firebase</text>

  <path d="M530 164 L640 164" class="wire ship" />

  <rect x="640" y="140" width="220" height="48" rx="10" class="node" />
  <text x="750" y="169" class="label" text-anchor="middle">Fastlane · GitLab CI</text>

  <path d="M750 188 L750 240" class="wire ship" />

  <rect x="640" y="240" width="220" height="44" rx="8" class="node" />
  <text x="750" y="267" class="label" text-anchor="middle">App Store · Play Store</text>

  <path d="M750 284 L750 340" class="wire watch" />

  <rect x="640" y="340" width="220" height="44" rx="8" class="node" />
  <text x="750" y="367" class="label" text-anchor="middle">Sentry · Datadog</text>
</svg>
