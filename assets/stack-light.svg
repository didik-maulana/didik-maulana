<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="Mobile clients on a shared core, backed by an API and a database">
  <style>
    .label { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #1f2328; }
    .caption { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #59636e; letter-spacing: 0.08em; }
    .node { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; rx: 8; }
    .wire { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
    .w1 { stroke: #F05138; }
    .w2 { stroke: #7F52FF; }
    .w3 { stroke: #5FA04E; }
    .w4 { stroke: #4169E1; }
    .core { fill: #f6f8fa; stroke: #0175C2; stroke-width: 1.5; rx: 10; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  </style>

  <rect x="60" y="18" width="150" height="42" class="node" />
  <text x="135" y="44" class="label" text-anchor="middle">Swift · iOS</text>

  <rect x="670" y="18" width="150" height="42" class="node" />
  <text x="745" y="44" class="label" text-anchor="middle">Kotlin · Android</text>

  <path d="M135 60 C135 92, 330 88, 375 98" class="wire w1" />
  <path d="M745 60 C745 92, 550 88, 505 98" class="wire w2" />

  <rect x="330" y="82" width="220" height="46" class="core" />
  <text x="440" y="110" class="label" text-anchor="middle">React Native · Flutter</text>
  <text x="440" y="145" class="caption" text-anchor="middle">ONE CODEBASE, TWO STORES</text>

  <path d="M375 128 C340 150, 250 152, 210 162" class="wire w3" />
  <path d="M505 128 C540 150, 630 152, 670 162" class="wire w4" />

  <rect x="60" y="150" width="150" height="42" class="node pulse" />
  <text x="135" y="176" class="label" text-anchor="middle">Node.js API</text>

  <rect x="670" y="150" width="150" height="42" class="node pulse" />
  <text x="745" y="176" class="label" text-anchor="middle">Postgres</text>
</svg>
